# Reverse proxy in front of Django (gunicorn) + static host for the built Vue app.
# `backend` is the compose service name, resolved by Docker's internal DNS.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # NOTE: add_header in a `location` REPLACES the ones inherited from `server`.
    # Keep location blocks free of add_header (use `expires` for caching instead).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Used by the container health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API, admin and Django's static files go to gunicorn.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django uses this to know the original scheme (see SECURE_PROXY_SSL_HEADER).
        proxy_set_header X-Forwarded-Proto $scheme;
        # Django also sets some of these; keep nginx's single copy so they are not duplicated.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Vite emits hashed file names, so these can be cached "forever".
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single page app: unknown paths (/domains/3) are handled by vue-router.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
