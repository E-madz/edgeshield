# Development overrides. `docker compose up` merges this file automatically.
# For production use only the base file: docker compose -f docker-compose.yml up
services:
  backend:
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # The worker does not auto-reload: after changing task code run `docker compose restart worker`.
  worker:
    volumes:
      - ./backend:/app
