name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: edgeshield_db
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DJANGO_DEBUG: "True"
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/edgeshield_db
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: System libraries for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev pkg-config
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Django system check
        run: python manage.py check
      - name: Migrations are in sync with the models
        run: python manage.py makemigrations --check --dry-run
      - name: Deployment check (production settings, HTTPS on)
        env:
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: edgeshield.example.com
          DJANGO_SECRET_KEY: ci-deploy-check-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
        run: python manage.py check --deploy --fail-level WARNING
      - name: Tests (MySQL 8 + real Redis)
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: Build production images
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build
